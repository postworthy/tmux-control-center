name: tmux-mobile-http-test

services:
  app:
    image: "tmux-mobile:${TMUX_MOBILE_IMAGE_TAG:-http-test}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TMUX_VERSION: "${TMUX_VERSION:?Set TMUX_VERSION to the host tmux release}"
    restart: unless-stopped
    init: true
    user: "${TMUX_MOBILE_UID:?Set TMUX_MOBILE_UID}:${TMUX_MOBILE_GID:?Set TMUX_MOBILE_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ports:
      - "${TAILSCALE_IP:?Set the exact host Tailscale IPv4 address}:${TMUX_MOBILE_HTTP_PORT:-8080}:5179"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Urls: http://0.0.0.0:5179
      AllowedHosts: "${TMUX_MOBILE_HOST:?Set the exact Tailscale IP or hostname}"
      Authentication__Mode: ApiKey
      Authentication__ApiKey: "${TMUX_MOBILE_API_KEY:?Set the temporary HTTP test access key}"
      Authentication__UnsafeAllowInsecureHttp: "true"
      Authentication__UnsafeAllowWeakApiKeyForTest: "true"
      Authentication__UnsafeTestProfileAcknowledgement: "TAILNET_TEST_ONLY"
      Security__AllowedOrigins__0: "${TMUX_MOBILE_ORIGIN:?Set the exact HTTP test origin}"
      ForwardedHeaders__Enabled: "false"
      Tmux__ExecutablePath: /usr/bin/tmux
      Tmux__SocketName: "${TMUX_SOCKET_NAME:-}"
      DataProtection__KeysDirectory: /state/keys
      Audit__Destination: /state/audit/audit.jsonl
    volumes:
      - type: bind
        source: "${TMUX_SOCKET_DIR:?Set the tmux owner's socket directory}"
        target: "/tmp/tmux-${TMUX_MOBILE_UID:?Set TMUX_MOBILE_UID}"
      - type: bind
        source: "${TMUX_MOBILE_KEYS_DIR:?Set a protected writable host directory}"
        target: /state/keys
      - type: bind
        source: "${TMUX_MOBILE_AUDIT_DIR:?Set a protected writable host directory}"
        target: /state/audit
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --header
        - "Host: ${TMUX_MOBILE_HOST:?Set the exact Tailscale IP or hostname}"
        - http://127.0.0.1:5179/health/live
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
