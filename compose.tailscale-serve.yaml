name: tmux-mobile-tailnet-serve

services:
  app:
    image: "tmux-mobile:${TMUX_MOBILE_IMAGE_TAG:-tailscale-serve}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TMUX_VERSION: "${TMUX_VERSION:?Set TMUX_VERSION to the host tmux release}"
    restart: unless-stopped
    init: true
    network_mode: bridge
    user: "${TMUX_MOBILE_UID:?Set TMUX_MOBILE_UID}:${TMUX_MOBILE_GID:?Set TMUX_MOBILE_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ports:
      - "127.0.0.1:${TMUX_MOBILE_HTTP_PORT:-8780}:5179"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Urls: http://0.0.0.0:5179
      AllowedHosts: "${TMUX_MOBILE_SERVE_HOST:?Set the exact Tailscale Serve hostname}"
      Authentication__Mode: ApiKey
      Authentication__ApiKey: "${TMUX_MOBILE_API_KEY:?Set the application access key}"
      Authentication__UnsafeAllowWeakApiKeyForTest: "true"
      Authentication__UnsafeTestProfileAcknowledgement: "TAILNET_TEST_ONLY"
      Security__AllowedOrigins__0: "${TMUX_MOBILE_SERVE_ORIGIN:?Set the exact Tailscale Serve HTTPS origin}"
      Security__ExternalHttpsTermination: "true"
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownProxies__0: "127.0.0.1"
      ForwardedHeaders__KnownProxyHosts__0: "host.docker.internal"
      Tmux__ExecutablePath: /usr/bin/tmux
      Tmux__SocketName: "${TMUX_SOCKET_NAME:-}"
      DataProtection__KeysDirectory: /state/keys
      Audit__Destination: /state/audit/audit.jsonl
    volumes:
      - type: bind
        source: "${TMUX_SOCKET_DIR:?Set the tmux owner's socket directory}"
        target: "/tmp/tmux-${TMUX_MOBILE_UID:?Set TMUX_MOBILE_UID}"
      - type: bind
        source: "${TMUX_MOBILE_KEYS_DIR:?Set a protected writable host directory}"
        target: /state/keys
      - type: bind
        source: "${TMUX_MOBILE_AUDIT_DIR:?Set a protected writable host directory}"
        target: /state/audit
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/tmux-mobile-healthcheck
        - --header
        - "Host: ${TMUX_MOBILE_SERVE_HOST:?Set the exact Tailscale Serve hostname}"
        - http://127.0.0.1:5179/health/live
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
